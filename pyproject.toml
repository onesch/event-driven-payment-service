[project]
name = "event-driven-payment-service"
version = "0.1.0"
description = "Asynchronous payment processing service built with FastAPI, PostgreSQL, RabbitMQ, and SQLAlchemy, featuring the transactional outbox pattern, idempotency, retries, and dead-letter queues."
readme = "README.md"
authors = [
    { name = "onesch" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.159.1",
    "faststream[rabbit]>=0.7.8",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
